# The gates on every push; the cold dependency job and the release build in the nightly batch.
#
# This file exists because three defects in this project survived for an unknown period each, and
# every one of them is caught by a command that already existed and that nobody ran:
#   - check-secrets.sh greped nothing at all, and said "ok" while doing it (f7d656d)
#   - PanelSmokeTest was red for three commits while the handoff claimed thirteen green (F-02/F-03)
#   - :app:assembleRelease had never been attempted (C-13)
#
# WHAT THIS CANNOT CATCH, stated so nobody adds it later thinking it was forgotten: the
# instrumented suite. Those tests need arm64, Horizon OS, the Meta Spatial SDK runtime and a 190 MB
# model on the device. A hosted x86 emulator would run NONE of them — the APK is arm64-only
# (app/build.gradle.kts, `abiFilters += "arm64-v8a"`) — and a green on a platform the app does not
# ship to is worse than no signal at all. The substitute is the device-gate ledger check below,
# which refuses a change to that suite that nobody recorded a run of.
name: ci

on:
  push:
  pull_request:
  # The nightly batch at 23:00 Europe/Warsaw (operator's CI policy of 2026-09-25, org-index
  # docs/CI-BATCHING.md) runs the cold dependency job and the release build below. A
  # supply-chain substitution that only shows on a cold cache would otherwise be found by whoever
  # next clears theirs. A manual dispatch runs them for an urgent candidate:
  # `gh workflow run ci.yml --ref <branch>`.
  schedule:
    - cron: '0 21 * * *'   # 23:00 Warsaw in summer time
    - cron: '0 22 * * *'   # 23:00 Warsaw in winter time
  workflow_dispatch:

# A second push to the same branch cancels the first: the interesting answer is always about the
# newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two crons cover both offsets of Europe/Warsaw; only the one that lands on 23:00 local runs
  # the batch, so it runs once a night, not twice.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.hour.outputs.run }}
    steps:
      - id: hour
        run: |
          h=$(TZ=Europe/Warsaw date +%H)
          if [ "$h" = 23 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "not 23:00 in Warsaw ($h); skipping this cron"; echo "run=false" >> "$GITHUB_OUTPUT"; fi

  checks:
    name: gates and unit tests
    needs: gate
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.gate.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive   # third_party/whisper.cpp; feature-stt's CMake guard needs it
          fetch-depth: 0          # check-docs.sh resolves commit SHAs against history

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'      # matches the JBR this project is developed on

      - uses: gradle/actions/setup-gradle@v5

      # One script, so "green locally" and "green in CI" cannot mean different sets of checks.
      # No NDK is installed in this job on purpose: measured 2026-09-20, testDebugUnitTest's task
      # graph contains no externalNativeBuild, so this job never compiles whisper.cpp.
      # One script, and now genuinely one: the device-gate check used to be a step here and
      # nowhere else, so "green locally" and "green in CI" meant different sets.
      - name: gates
        run: bash scripts/check-all.sh
        env:
          BASE_REF: origin/${{ github.event.repository.default_branch }}

      # Printed into the log on every push, and deliberately not a gate — see the header of
      # `scripts/exposure.sh`. `--detail` here because a CI log is read after the fact, when the
      # question is *which* row, not how many.
      - name: how stale is what we believe we have verified
        if: always()
        run: bash scripts/exposure.sh --detail

      # A verification failure must not be read as a generic build error. `check-all.sh` above
      # already runs the JVM suite, so this step only fires when that one did not — it is here to
      # name the runbook at the moment somebody is staring at a checksum they do not recognise.
      - name: dependency verification, said in words
        if: failure()
        run: |
          echo "::error::if the failure above names verification-metadata.xml or 'Dependency verification failed', read docs/runbooks/dependencies.md — it is NEVER fixed by deleting the file or passing --dependency-verification off"

  # A republished artefact should be found by a nightly, not by the next person who clears their
  # cache. `--refresh-dependencies` is the whole point: the warm cache in the job above would
  # happily verify bytes it downloaded weeks ago.
  dependencies:
    name: dependency verification, cold
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.run == 'true') }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # **`check-docs.sh` resolves commit SHAs against history**, and `VersionCodeTest`
          # orders the commits it can reach — both need more than one.
          #
          # It used to be the release's own correctness that depended on this line: `versionCode`
          # came from `rev-list --count HEAD`, which answers `1` in a `--depth 1` clone, and this
          # job shipped that number for eleven commits. Since `B-160` the stamp is
          # `show -s --format=%ct HEAD` — the commit object the clone is *for* — so it is right
          # at any depth and the build no longer has to refuse a shallow one. The line stays for
          # the gates; a job added without it now fails a documentation check rather than
          # releasing an unorderable APK.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true

      # Not the release build: this job is about what resolving pulls, and the JVM suite plus the
      # androidTest compile resolve everything the metadata covers without paying for the NDK.
      - name: resolve everything, cold, and verify it
        run: ./gradlew --no-daemon --refresh-dependencies testDebugUnitTest :app:assembleDebugAndroidTest

  release:
    name: release build
    # The expensive job: the NDK, whisper.cpp for arm64, R8. In the nightly batch on `main` (the
    # one branch since `DEC-0099`), or on a manual dispatch — never per push.
    needs: gate
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.gate.outputs.run == 'true' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # **`check-docs.sh` resolves commit SHAs against history**, and `VersionCodeTest`
          # orders the commits it can reach — both need more than one.
          #
          # It used to be the release's own correctness that depended on this line: `versionCode`
          # came from `rev-list --count HEAD`, which answers `1` in a `--depth 1` clone, and this
          # job shipped that number for eleven commits. Since `B-160` the stamp is
          # `show -s --format=%ct HEAD` — the commit object the clone is *for* — so it is right
          # at any depth and the build no longer has to refuse a shallow one. The line stays for
          # the gates; a job added without it now fails a documentation check rather than
          # releasing an unorderable APK.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # NOT `android-actions/setup-android`. It replaces the runner's preinstalled command-line
      # tools with a version of its own and then re-accepts every licence; on 2026-09-20 that step
      # exited 1 on `sdkmanager --licenses` and took this job with it — five pushes in a row where
      # `lint` and `assembleRelease` never ran at all while the cheap job was green, so the build
      # looked checked and was not. The runner image already ships the SDK with its licences
      # accepted; the only thing missing is the NDK this project pins.
      - name: install the pinned NDK
        run: |
          set -eu
          # `yes |` answers a licence prompt if the image has not accepted that one; the pipe makes
          # sdkmanager's own exit code unreliable (SIGPIPE), so the directory test below — not the
          # installer — is what this step actually asserts.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" || true
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
        env:
          NDK_VERSION: '27.2.12479018'   # feature-stt/build.gradle.kts:9 — keep it, release.yml and this in step

      - uses: gradle/actions/setup-gradle@v5

      # The .cxx tree is what makes a second run cheap; without it every run recompiles
      # whisper.cpp for arm64 from scratch.
      - name: cache the native build
        uses: actions/cache@v5
        with:
          path: |
            feature-stt/.cxx
            feature-stt/build/intermediates/cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('.gitmodules', 'feature-stt/src/main/cpp/**', 'feature-stt/build.gradle.kts') }}

      # Lint lives here, not in the cheap job: its task graph pulls externalNativeBuild, so running
      # it anywhere else drags the NDK and a full arm64 compile into a gate meant to answer in
      # seconds. Measured 2026-09-20.
      - name: lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: assemble release
        # **No `-PversionCode`.** `app/build.gradle.kts` stamps the version from git now, and
        # `github.run_number` is a second monotonic sequence over the same field: a release built
        # at run 50 and a local build at commit 120 cannot be ordered, and Android refuses a
        # downgrade install. One sequence, and it is the one reproducible from a commit (`T-038`).
        run: ./gradlew --no-daemon :app:assembleRelease

      # THIS APK IS UNSIGNED, and stays so: keystore.properties is untracked and absent here, so the
      # build takes its unsigned branch and logs that it did. It proves R8, the NDK, lint and the
      # manifest merge every night with no approval — not signing, and not that any headset will
      # install it. The signed release is `release.yml` alone, in the protected `release`
      # environment, on a version tag (`DEC-0104`, docs/deployment/signing.md); this job never
      # touches the release key. The install procedure is T-037.
      - uses: actions/upload-artifact@v6
        with:
          name: app-release-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
